# Secrets Configuration for IsPilot API
# This file documents all secrets that need to be stored in Google Cloud Secret Manager

secrets:
  ispilot-api-key:
    description: "API key for IsPilot API authentication"
    usage: "X-API-Key header validation"
    rotation: "Every 90 days (recommended)"
    creation_script: |
      # Create a random API key (32 characters)
      API_KEY=$(openssl rand -hex 16)
      
      # Create the secret in Secret Manager
      echo -n "$API_KEY" | gcloud secrets create ispilot-api-key \
        --project=corp-stro-salesinventory-prod \
        --replication-policy="automatic" \
        --data-file=-
      
      # Grant Cloud Run service account access
      gcloud secrets add-iam-policy-binding ispilot-api-key \
        --project=corp-stro-salesinventory-prod \
        --member=serviceAccount:sa-ispilot-api@corp-stro-salesinventory-prod.iam.gserviceaccount.com \
        --role=roles/secretmanager.secretAccessor
      
      echo "Secret created: ispilot-api-key"
      echo "API Key: $API_KEY"

service_account:
  name: "sa-ispilot-api"
  project: "corp-stro-salesinventory-prod"
  email: "sa-ispilot-api@corp-stro-salesinventory-prod.iam.gserviceaccount.com"
  required_roles:
    - roles/aiplatform.user  # Access to Vertex AI
    - roles/datastore.user   # Access to Firestore
    - roles/secretmanager.secretAccessor  # Access to secrets
    - roles/logging.logWriter  # Write logs to Cloud Logging
    - roles/monitoring.metricWriter  # Write metrics to Cloud Monitoring

  creation_script: |
    # Create service account
    gcloud iam service-accounts create sa-ispilot-api \
      --project=corp-stro-salesinventory-prod \
      --display-name="IsPilot API Service Account"
    
    # Grant required roles
    gcloud projects add-iam-policy-binding corp-stro-salesinventory-prod \
      --member=serviceAccount:sa-ispilot-api@corp-stro-salesinventory-prod.iam.gserviceaccount.com \
      --role=roles/aiplatform.user
    
    gcloud projects add-iam-policy-binding corp-stro-salesinventory-prod \
      --member=serviceAccount:sa-ispilot-api@corp-stro-salesinventory-prod.iam.gserviceaccount.com \
      --role=roles/datastore.user
    
    gcloud projects add-iam-policy-binding corp-stro-salesinventory-prod \
      --member=serviceAccount:sa-ispilot-api@corp-stro-salesinventory-prod.iam.gserviceaccount.com \
      --role=roles/secretmanager.secretAccessor
    
    gcloud projects add-iam-policy-binding corp-stro-salesinventory-prod \
      --member=serviceAccount:sa-ispilot-api@corp-stro-salesinventory-prod.iam.gserviceaccount.com \
      --role=roles/logging.logWriter
    
    gcloud projects add-iam-policy-binding corp-stro-salesinventory-prod \
      --member=serviceAccount:sa-ispilot-api@corp-stro-salesinventory-prod.iam.gserviceaccount.com \
      --role=roles/monitoring.metricWriter

local_development:
  description: "For local development, use Application Default Credentials (ADC)"
  setup: |
    # 1. Authenticate with your personal Google account
    gcloud auth application-default login
    
    # 2. Set GOOGLE_APPLICATION_CREDENTIALS to use a service account key (optional)
    export GOOGLE_APPLICATION_CREDENTIALS="/path/to/service-account-key.json"
    
    # 3. For local API key testing, set directly in .env:
    ISPILOT_API_KEY="test-local-key"
    
    # 4. Optionally, fetch the actual secret from Secret Manager for integration testing:
    export ISPILOT_API_KEY=$(gcloud secrets versions access latest --secret=ispilot-api-key --project=corp-stro-salesinventory-prod)
