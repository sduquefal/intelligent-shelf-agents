[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-shelf-agents"
version = "0.1.0"
description = "Intelligent Shelf AI multi-agent platform"
requires-python = ">=3.12"

dependencies = [
    "google-adk>=2.6.3",
    "google-cloud-bigquery>=3.43.0",
    "google-cloud-secret-manager>=2.24.0",
    "google-genai",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "common*",
    "domain*",
    "gateways*",
    "repositories*",
    "services*",
    "agents*",
]